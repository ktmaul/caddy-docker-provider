services:
  caddy:
    image: caddy:2
    labels:
      caddy.server: true
    ports:
      - 40080:80/tcp
      - 40443:443/tcp
      - 40443:443/udp
    restart: unless-stopped
    volumes:
     - ./Caddyfile:/etc/caddy/Caddyfile
  router:
    build: .
    image: caddy-docker-router:dev
    depends_on:
      - caddy
    environment:
      CADDY_API_URL: http://localhost:2019/
      LOG_LEVEL: DEBUG
    network_mode: service:caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock