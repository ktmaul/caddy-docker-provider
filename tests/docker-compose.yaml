name: caddy-docker-provider

services:
  caddy:
    image: caddy:2
    labels:
      caddy.server: true
    ports:
      - 40080:80/tcp
      - 40443:443/tcp
      - 40443:443/udp
    restart: unless-stopped
    volumes:
     - ./Caddyfile:/etc/caddy/Caddyfile # Setting static routes and other configs
  provider:
    build: ..
    image: caddy-docker-provider:dev
    depends_on:
      - caddy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      #start_period: 30s
    environment:
      #CADDY_API_URL: http://localhost:2019/
      LOG_LEVEL: DEBUG
    network_mode: service:caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  services:
    image: busybox
    command: httpd -f -v -p 8080
    depends_on:
      provider:
        condition: service_healthy
    deploy:
      replicas: 2
    labels:
      caddy.enable: "true"
      caddy.routes.busybox.hosts: example.com example.org
      caddy.routes.busybox.upstream.port: "8080"
      caddy.routes.busybox2.hosts: busybox.example.com
      caddy.routes.busybox2.upstream.port: "8081"